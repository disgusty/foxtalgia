plugins {
    id 'com.android.application'
}

def engine = providers.gradleProperty('foxtalgia.engine').getOrElse('stock')
def abis = providers.gradleProperty('foxtalgia.abis').getOrElse('')

android {
    namespace 'com.disgusty.foxtalgia'
    compileSdk 37

    defaultConfig {
        applicationId 'com.disgusty.foxtalgia'
        // Android 4.2. Everything newer is reached through Sdk.INT checks.
        minSdk 17
        targetSdk 35
        versionCode 100
        versionName '1.0'
        multiDexEnabled true
        buildConfigField 'String', 'ENGINE', "\"${engine}\""
        if (!abis.isEmpty()) {
            ndk { abiFilters.addAll(abis.split(',') as List) }
        }
    }

    signingConfigs {
        release {
            // The release key lives outside the source tree (FoxFork/keys next to the checkout by default).
            def keysDir = rootProject.file(providers.gradleProperty('foxtalgia.keysDir').getOrElse('../keys'))
            def props = new File(keysDir, 'keystore.properties')
            if (props.exists()) {
                def p = new Properties()
                props.withInputStream { p.load(it) }
                storeFile new File(keysDir, p.getProperty('storeFile'))
                storePassword p.getProperty('storePassword')
                keyAlias p.getProperty('keyAlias')
                keyPassword p.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    if (engine == 'legacy') {
        // libfoxcompat.so: libc/NDK functions Android 4.x lacks (port/compat), loaded before Gecko's libraries.
        sourceSets.main.jniLibs.srcDirs += ['../../port/compat/out']
    }

    packaging {
        jniLibs {
            // Gecko loads its libraries itself and needs them extracted on Android < 6.
            useLegacyPackaging true
        }
    }

    lint {
        error 'NewApi', 'InlinedApi'
        lintConfig file('lint.xml')
        abortOnError true
        checkReleaseBuilds false
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'MissingTranslation', 'SetTextI18n', 'UnusedResources',
                'ObsoleteSdkInt', 'DiscouragedApi', 'GradleDependency', 'AndroidGradlePluginVersion', 'NewerVersionAvailable',
                // GeckoResult callbacks run on the thread that created them (the UI thread here); lint cannot see that.
                'WrongThread', 'UnsafeOptInUsageError'
    }
}

// GeckoView 157 asks for androidx releases that need Android 6+ and AGP 9; these older ones cover what it uses
// (port/reports/java-deps.md) and run on Android 4.2.
configurations.configureEach {
    resolutionStrategy {
        force 'androidx.core:core:1.12.0'
        force 'androidx.annotation:annotation-experimental:1.3.1'
        force 'androidx.lifecycle:lifecycle-common:2.6.2'
        force 'androidx.lifecycle:lifecycle-process:2.6.2'
        force 'androidx.lifecycle:lifecycle-runtime:2.6.2'
        force 'androidx.startup:startup-runtime:1.1.1'
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    if (engine == 'legacy') {
        implementation "org.mozilla.geckoview:geckoview-legacy:${providers.gradleProperty('foxtalgia.legacyGeckoviewVersion').get()}"
    } else {
        implementation("org.mozilla.geckoview:geckoview:${providers.gradleProperty('foxtalgia.geckoviewVersion').get()}") {
            // HLS (ExoPlayer) and WebAuthn (Play services) need Android 6+/7+; the legacy engine is built without them.
            exclude group: 'androidx.media3'
            exclude group: 'com.google.android.gms'
        }
    }
}
