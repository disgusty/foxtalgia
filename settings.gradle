pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // GeckoView built by port/ for Android 4.2+ is published here (see port/README.md).
        maven { url = uri("${rootDir}/../port/maven") }
        google()
        mavenCentral()
        maven { url = uri('https://maven.mozilla.org/maven2/') }
    }
}

rootProject.name = 'Foxtalgia'
include ':app'
